<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="100%" height="100%" style="background-color: #0d1117; font-family: system-ui, -apple-system, sans-serif;">
  <defs>
    <linearGradient id="primaryGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF385C"/>
      <stop offset="100%" stop-color="#E00B41"/>
    </linearGradient>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161b22"/>
      <stop offset="100%" stop-color="#21262d"/>
    </linearGradient>
    <linearGradient id="edgeGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#388bfd"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Title & Header -->
  <text x="600" y="45" text-anchor="middle" fill="#ffffff" font-size="24" font-weight="700" letter-spacing="0.5">Production Architecture — Vacation Rental Marketplace</text>
  <text x="600" y="70" text-anchor="middle" fill="#8b949e" font-size="14">Global Scalable Edge, Microservices, Data Layers &amp; Event Bus System</text>

  <!-- Layer 1: Client & CDN Edge -->
  <g transform="translate(100, 100)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="90" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="30" y="30" fill="#388bfd" font-size="12" font-weight="700" text-transform="uppercase" letter-spacing="1">1. Global Client &amp; Edge Tier</text>
    
    <!-- Nodes -->
    <rect x="50" y="42" width="240" height="36" rx="6" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1"/>
    <text x="170" y="65" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Client Apps (Web / Mobile)</text>

    <path d="M 290 60 L 370 60" stroke="#8b949e" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow)"/>

    <rect x="380" y="42" width="280" height="36" rx="6" fill="url(#edgeGlow)"/>
    <text x="520" y="65" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Cloudflare Anycast CDN &amp; WAF</text>

    <path d="M 660 60 L 740 60" stroke="#8b949e" stroke-width="2" stroke-dasharray="4"/>

    <rect x="750" y="42" width="200" height="36" rx="6" fill="#1f6feb" fill-opacity="0.2" stroke="#388bfd" stroke-width="1"/>
    <text x="850" y="65" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">AWS CloudFront (Media)</text>
  </g>

  <!-- Layer 2: API Gateway -->
  <g transform="translate(100, 220)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="70" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="30" y="25" fill="#a371f7" font-size="12" font-weight="700" text-transform="uppercase" letter-spacing="1">2. API Gateway &amp; Security Layer</text>
    <rect x="250" y="22" width="500" height="36" rx="6" fill="#a371f7" fill-opacity="0.2" stroke="#a371f7" stroke-width="1.5"/>
    <text x="500" y="45" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Kong API Gateway (OAuth2, Rate Limiting, TLS, Circuit Breaking)</text>
  </g>

  <!-- Layer 3: Microservices Grid -->
  <g transform="translate(100, 320)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="180" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="30" y="28" fill="#FF385C" font-size="12" font-weight="700" text-transform="uppercase" letter-spacing="1">3. Core Microservices Cluster (Kubernetes / EKS)</text>
    
    <!-- Microservice Boxes -->
    <rect x="40" y="45" width="210" height="50" rx="6" fill="url(#primaryGlow)"/>
    <text x="145" y="75" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Listing Service</text>

    <rect x="280" y="45" width="210" height="50" rx="6" fill="url(#primaryGlow)"/>
    <text x="385" y="75" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Search &amp; Geo Service</text>

    <rect x="520" y="45" width="210" height="50" rx="6" fill="url(#primaryGlow)"/>
    <text x="625" y="75" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Booking &amp; Saga Service</text>

    <rect x="760" y="45" width="200" height="50" rx="6" fill="url(#primaryGlow)"/>
    <text x="860" y="75" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Payment Service</text>

    <rect x="160" y="110" width="210" height="50" rx="6" fill="#21262d" stroke="#FF385C" stroke-width="1"/>
    <text x="265" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">User &amp; Auth Service</text>

    <rect x="400" y="110" width="210" height="50" rx="6" fill="#21262d" stroke="#FF385C" stroke-width="1"/>
    <text x="505" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Review Service</text>

    <rect x="640" y="110" width="210" height="50" rx="6" fill="#21262d" stroke="#FF385C" stroke-width="1"/>
    <text x="745" y="140" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Notification Service</text>
  </g>

  <!-- Layer 4: Data & Caching Tier -->
  <g transform="translate(100, 530)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="110" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="30" y="25" fill="#3fb950" font-size="12" font-weight="700" text-transform="uppercase" letter-spacing="1">4. Data Persistence &amp; Caching Layer</text>

    <rect x="40" y="40" width="210" height="50" rx="6" fill="#238636" fill-opacity="0.3" stroke="#3fb950" stroke-width="1"/>
    <text x="145" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">PostgreSQL (Primary + Replicas)</text>

    <rect x="280" y="40" width="210" height="50" rx="6" fill="#238636" fill-opacity="0.3" stroke="#3fb950" stroke-width="1"/>
    <text x="385" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Redis Cluster (Locks &amp; Cache)</text>

    <rect x="520" y="40" width="210" height="50" rx="6" fill="#238636" fill-opacity="0.3" stroke="#3fb950" stroke-width="1"/>
    <text x="625" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Elasticsearch (Search Index)</text>

    <rect x="760" y="40" width="200" height="50" rx="6" fill="#238636" fill-opacity="0.3" stroke="#3fb950" stroke-width="1"/>
    <text x="860" y="70" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">AWS S3 (Object Store)</text>
  </g>

  <!-- Layer 5: Event Bus & Observability -->
  <g transform="translate(100, 665)" filter="url(#shadow)">
    <rect x="0" y="0" width="1000" height="90" rx="10" fill="url(#cardBg)" stroke="#30363d" stroke-width="1.5"/>
    <text x="30" y="25" fill="#f0883e" font-size="12" font-weight="700" text-transform="uppercase" letter-spacing="1">5. Event Bus &amp; Observability Infrastructure</text>

    <rect x="50" y="38" width="420" height="40" rx="6" fill="#bd561d" fill-opacity="0.3" stroke="#f0883e" stroke-width="1"/>
    <text x="260" y="63" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">Apache Kafka Event Bus (Async Pub/Sub)</text>

    <rect x="530" y="38" width="420" height="40" rx="6" fill="#bd561d" fill-opacity="0.3" stroke="#f0883e" stroke-width="1"/>
    <text x="740" y="63" text-anchor="middle" fill="#ffffff" font-size="13" font-weight="600">OpenTelemetry + Prometheus + Grafana + Jaeger</text>
  </g>
</svg>
